/* CARD111 card style editor v46 */
/* CARD111 editor preview and split v47 */
.editorPreviewWrap{display:flex;justify-content:center;margin:0 0 12px}
.editorPreview{width:240px;min-height:140px;height:140px!important;flex:none;border-radius:18px}
.editorPreview strong{font-size:18px!important}
.editorTabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 12px;padding:4px;background:#f0f1f4;border-radius:14px}
.editorTab{border:0;border-radius:10px;background:transparent;padding:10px 8px;font:inherit;font-weight:700;color:#737780}
.editorTab.active{background:#fff;color:#17181c;box-shadow:0 1px 4px #0001}
.editorPanel{display:none}.editorPanel.active{display:block}
.editorPreviewHint{text-align:center;margin:-3px 0 12px}
.editorAppearance .coverPicker{margin-top:0}
.editorAppearance .coverGrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.editorAppearance .coverOption{min-height:70px;padding:8px 5px;text-align:center;font-size:11px;border-radius:12px}

.card.palette-red{background:linear-gradient(135deg,#ef3340,#b30f30)!important}.card.palette-blue{background:linear-gradient(135deg,#1767d8,#163c91)!important}.card.palette-green{background:linear-gradient(135deg,#0aa66d,#087557)!important}.card.palette-purple{background:linear-gradient(135deg,#7b3fe4,#45218b)!important}.card.palette-amber{background:linear-gradient(135deg,#f5bd2e,#c47708)!important}.card.palette-graphite{background:linear-gradient(135deg,#4a5058,#17181c)!important}.card.palette-light{background:linear-gradient(135deg,#fff,#e7e9ed)!important}

.cardStylePicker{margin-top:14px;padding:14px;border:1px solid #e4e6eb;border-radius:18px;background:#fafbfc}.styleBlockTitle{margin-top:14px}.styleGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:7px}.styleOption{min-height:42px;border:2px solid #e2e3e8;border-radius:12px;background:#fff;padding:8px 10px;font:inherit;font-weight:700;color:#30333a}.styleOption.selected{border-color:#1677ff;box-shadow:0 0 0 1px #1677ff inset}
.palette-choice-red{background:linear-gradient(135deg,#ef3340,#b30f30);color:#fff}.palette-choice-blue{background:linear-gradient(135deg,#1767d8,#163c91);color:#fff}.palette-choice-green{background:linear-gradient(135deg,#0aa66d,#087557);color:#fff}.palette-choice-purple{background:linear-gradient(135deg,#7b3fe4,#45218b);color:#fff}.palette-choice-amber{background:linear-gradient(135deg,#f5bd2e,#c47708);color:#17181c}.palette-choice-graphite{background:linear-gradient(135deg,#4a5058,#17181c);color:#fff}.palette-choice-light{background:linear-gradient(135deg,#fff,#e7e9ed);color:#17181c}
.textColorGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:7px}.styleColorChoice{min-height:42px;border:2px solid #e2e3e8;border-radius:12px;background:#fff;padding:5px 3px;font:11px inherit;font-weight:700;color:#30333a}.styleColorChoice span{display:block;width:20px;height:20px;border-radius:50%;margin:0 auto 3px;border:1px solid #c9cbd0}.styleColorChoice b{font-weight:650}.styleColorChoice.selected{border-color:#1677ff;box-shadow:0 0 0 1px #1677ff inset}.style-color-white span{background:#fff}.style-color-black span{background:#17181c}.style-color-yellow span{background:#ffd43b}.style-color-red span{background:#e03131}.style-color-green span{background:#159447}.style-color-blue span{background:#1767d8}
.styleRange{width:100%;margin-top:7px;accent-color:#1677ff}.fontGrid .styleOption{font-size:15px}

 
</style>

<body>
<div class="app">
<header><div><h1>Мои карты лояльности</h1><div class="sub" id="count">0 карт</div></div><button class="btn addBtn" onclick="addMenu()">Добавить карту</button></header>
<div class="search"><input id="search" placeholder="Поиск карты" oninput="render()"></div>
<main id="cards" class="grid"></main>
</div>
<button class="fab" onclick="addMenu()">＋</button>
<div id="modal" class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<script>
const KEY="card_wallet_v1";
const SAFE_KEY=KEY+"_safe_backup";
const colors=["#17181c","#3157d5","#16845b","#a35b17","#7b3db7","#c23b55"];
const COVER_LABELS={AUTO:"Автоматически по магазину",MAGNIT:"Магнит",PYATEROCHKA:"Пятёрочка",STOLICHKI:"Столички",PEREKRESTOK:"Перекрёсток",LENTA:"Лента",VkusVill:"ВкусВилл",OKEI:"О'КЕЙ",ASHAN:"АШАН",DIKSI:"Дикси",CHIZHIK:"Чижик",ANTEY:"Аптека Антей",RODINA_UDACHA:"Родина / УДАЧА / Высшая лига",DETMIR:"Детский мир",KARI:"kari CLUB",DNS:"ДНС",BRISTOL:"Бристоль",K_B:"Красное & Белое",CUSTOM:"Свой вариант"};
function coverForName(name){
  const n=String(name||"").toLowerCase().replace(/ё/g,"е");
  if(n.includes("магнит"))return "MAGNIT";
  if(n.includes("пятероч")||n.includes("пятерка")||n.includes("5ка")||n.includes("5-ка"))return "PYATEROCHKA";
  if(n.includes("столичк"))return "STOLICHKI";
  if(n.includes("перекрест"))return "PEREKRESTOK";
  if(n.includes("лента"))return "LENTA";
  if(n.includes("вкусвилл"))return "VkusVill";
  if(n.includes("окей")||n.includes("o'кей")||n.includes("o'kei"))return "OKEI";
  if(n.includes("ашан"))return "ASHAN";
  if(n.includes("дикси"))return "DIKSI";
  if(n.includes("чижик"))return "CHIZHIK";
  if(n.includes("антей")||n.includes("аптека антей"))return "ANTEY";
  if(n.includes("родина")||n.includes("удача")||n.includes("высшая лига")||n.includes("лига гранд"))return "RODINA_UDACHA";
  if(n.includes("детский мир")||n.includes("детскиймир"))return "DETMIR";
  if(n.includes("kari")||n.includes("кари"))return "KARI";
  if(n.includes("днс")||n.includes("dns"))return "DNS";
  if(n.includes("бристоль"))return "BRISTOL";
  if(n.includes("красное белое")||n.includes("красное&белое")||n.includes("красное и белое"))return "K_B";
  return "CUSTOM";
}

const CARD_PALETTES={AUTO:"Фирменная",RED:"Красная",BLUE:"Синяя",GREEN:"Зелёная",PURPLE:"Фиолетовая",AMBER:"Янтарная",GRAPHITE:"Графитовая",LIGHT:"Светлая"};
const CARD_TEXT_COLORS={WHITE:"#ffffff",BLACK:"#17181c",YELLOW:"#ffd43b",RED:"#e03131",GREEN:"#159447",BLUE:"#1767d8"};
const CARD_TEXT_COLOR_LABELS={WHITE:"Белый",BLACK:"Чёрный",YELLOW:"Жёлтый",RED:"Красный",GREEN:"Зелёный",BLUE:"Синий"};
const CARD_TEXT_POSITIONS={HIDE:"Не показывать",TOP:"Сверху",CENTER:"По центру",BOTTOM:"Снизу"};
const CARD_FONTS={SYSTEM:'system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif',ARIAL:"Arial,Helvetica,sans-serif",TREBUCHET:'"Trebuchet MS",Arial,sans-serif',GEORGIA:'Georgia,"Times New Roman",serif',COURIER:'"Courier New",monospace'};
const CARD_FONT_LABELS={SYSTEM:"Системный",ARIAL:"Arial",TREBUCHET:"Trebuchet",GEORGIA:"Georgia",COURIER:"Courier"};
function cardStyle(c){
  const s=(c&&c.style&&typeof c.style==="object")?c.style:{};
  return {palette:CARD_PALETTES[s.palette]?s.palette:"AUTO",textColor:CARD_TEXT_COLORS[s.textColor]?s.textColor:"WHITE",position:CARD_TEXT_POSITIONS[s.position]?s.position:"CENTER",size:Math.max(14,Math.min(28,Number(s.size)||19)),font:CARD_FONTS[s.font]?s.font:"SYSTEM"};
}
function cardStyleClass(c){const s=cardStyle(c);return "palette-"+s.palette.toLowerCase()+" title-"+s.position.toLowerCase();}
function cardStyleInline(c){const s=cardStyle(c);return "--title-color:"+CARD_TEXT_COLORS[s.textColor]+";--title-size:"+s.size+"px;--title-font:"+CARD_FONTS[s.font]+";"}
function paletteOptions(selected){return Object.keys(CARD_PALETTES).map(function(k){return '<button type="button" class="styleOption paletteChoice palette-choice-'+k.toLowerCase()+(k===selected?" selected":"")+'" data-palette="'+k+'">'+esc(CARD_PALETTES[k])+'</button>';}).join("");}
function textColorOptions(selected){return Object.keys(CARD_TEXT_COLORS).map(function(k){return '<button type="button" class="styleColorChoice style-color-'+k.toLowerCase()+(k===selected?" selected":"")+'" data-text-color="'+k+'" title="'+esc(CARD_TEXT_COLOR_LABELS[k])+'"><span></span><b>'+esc(CARD_TEXT_COLOR_LABELS[k])+'</b></button>';}).join("");}
function positionOptions(selected){return Object.keys(CARD_TEXT_POSITIONS).map(function(k){return '<button type="button" class="styleOption positionChoice '+(k===selected?" selected":"")+'" data-position="'+k+'">'+esc(CARD_TEXT_POSITIONS[k])+'</button>';}).join("");}
function fontOptions(selected){return Object.keys(CARD_FONTS).map(function(k){return '<button type="button" class="styleOption fontChoice '+(k===selected?" selected":"")+'" data-font="'+k+'" style="font-family:'+CARD_FONTS[k]+'">'+esc(CARD_FONT_LABELS[k])+'</button>';}).join("");}
function styleEditor(c){
  const s=cardStyle(c);
  return '<div class="cardStylePicker"><div class="hint">Цветовая палитра</div><input id="cardPalette" type="hidden" value="'+esc(s.palette)+'"><div id="paletteGrid" class="styleGrid">'+paletteOptions(s.palette)+'</div>'+
    '<div class="hint styleBlockTitle">Расположение названия</div><input id="titlePosition" type="hidden" value="'+esc(s.position)+'"><div id="positionGrid" class="styleGrid">'+positionOptions(s.position)+'</div>'+
    '<div class="hint styleBlockTitle">Цвет текста</div><input id="titleColor" type="hidden" value="'+esc(s.textColor)+'"><div id="textColorGrid" class="textColorGrid">'+textColorOptions(s.textColor)+'</div>'+
    '<div class="hint styleBlockTitle">Размер текста: <b id="titleSizeValue">'+s.size+' px</b></div><input id="titleSize" type="range" min="14" max="28" step="1" value="'+s.size+'" class="styleRange">'+
    '<div class="hint styleBlockTitle">Шрифт</div><input id="titleFont" type="hidden" value="'+esc(s.font)+'"><div id="fontGrid" class="styleGrid fontGrid">'+fontOptions(s.font)+'</div></div>';
}
function bindStyleEditor(){
  function bindGrid(id,inputId,attr){const grid=document.getElementById(id),input=document.getElementById(inputId);if(!grid||!input)return;grid.querySelectorAll("button").forEach(function(btn){btn.onclick=function(){input.value=btn.getAttribute(attr)||"";grid.querySelectorAll("button").forEach(function(x){x.classList.remove("selected");});btn.classList.add("selected");if(typeof refreshEditorPreview==="function")refreshEditorPreview(window.__editorPreviewCard||{});};});}
  bindGrid("paletteGrid","cardPalette","data-palette");bindGrid("positionGrid","titlePosition","data-position");bindGrid("textColorGrid","titleColor","data-text-color");bindGrid("fontGrid","titleFont","data-font");
  const range=document.getElementById("titleSize"),out=document.getElementById("titleSizeValue");if(range&&out)range.oninput=function(){out.textContent=range.value+" px";};
}
function coverForCard(c){const v=String(c.cover||"AUTO");return v==="AUTO"?coverForName(c.name):COVER_LABELS[v]?v:"CUSTOM";}
function coverClass(c){return "cover-"+coverForCard(c).toLowerCase();}
function coverOptions(selected){
  return Object.keys(COVER_LABELS).map(function(k){
    return '<button type="button" class="coverOption '+("cover-"+k.toLowerCase())+(k===selected?" selected":"")+'" data-cover="'+k+'">'+esc(COVER_LABELS[k])+'</button>';
  }).join("");
}
function bindCoverPicker(){
  const input=document.getElementById("cover");
  const grid=document.getElementById("coverGrid")||document.getElementById("editorCoverGrid");
  if(!grid)return;
  grid.querySelectorAll(".coverOption").forEach(function(btn){
    btn.onclick=function(){
      if(input)input.value=btn.getAttribute("data-cover")||"AUTO";
      grid.querySelectorAll(".coverOption").forEach(function(x){x.classList.remove("selected");});
      btn.classList.add("selected");
    };
  });
}
let cards=[];
let storageState="missing";
let storageError="";
try{
  const raw=localStorage.getItem(KEY);
  if(raw===null){
    cards=[];
    storageState="missing";
  }else{
    const parsed=JSON.parse(raw);
    if(!Array.isArray(parsed))throw new Error("локальная база имеет неверный формат");
    cards=parsed;
    storageState="ok";
    if(raw && cards.length){
      try{localStorage.setItem(SAFE_KEY,raw);}catch(e){}
    }
  }
}catch(e){
  storageState="error";
  storageError=String(e&&e.message||e);
  cards=[];
}

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];
  });
}
function save(){
  try{
    const current=localStorage.getItem(KEY);
    if(current){
      try{localStorage.setItem(SAFE_KEY,current);}catch(e){}
    }
    localStorage.setItem(KEY,JSON.stringify(cards));
    storageState="ok";
    storageError="";
  }catch(e){alert("Не удалось сохранить карту в памяти браузера");}
  render();
}
function exportStorageRecovery(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw){alert("В локальной памяти нет данных для восстановления.");return;}
    const blob=new Blob([raw],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="CARD_storage_recovery.json";
    a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  }catch(e){alert("Не удалось выгрузить данные локальной памяти");}
}
function readImage(file){
  return new Promise(function(resolve,reject){
    const r=new FileReader();
    r.onload=function(){resolve(String(r.result||""));};
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}
function syncCardsFromStorage(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return false;
    const parsed=JSON.parse(raw);
    if(!Array.isArray(parsed))return false;
    const normalized=parsed.filter(function(x){return x&&typeof x==="object"&&(x.code||x.barcode||x.number||x.cardNumber);}).map(function(x){
      return {
        id:String(x.id||Date.now()+Math.random()),
        name:String(x.name||x.title||"Моя карта"),
        code:String(x.code||x.barcode||x.number||x.cardNumber),
        format:String(x.format||"CODE_128"),
        image:String(x.image||x.logo||""),
        color:String(x.color||colors[0]),
        cover:String(x.cover||"AUTO"),
        style:(x.style&&typeof x.style==="object")?x.style:{}
      };
    });
    cards=normalized;
    storageState="ok";
    storageError="";
    return true;
  }catch(e){
    return false;
  }
}
function render(){
  if(!cards.length)syncCardsFromStorage();
  const search=document.getElementById("search");
  const q=(search.value||"").toLowerCase().trim();
  const list=cards.filter(function(c){
    return String(c.name||"").toLowerCase().includes(q)||String(c.code||"").toLowerCase().includes(q);
  });
  document.getElementById("count").textContent=cards.length+" карт";
  const out=document.getElementById("cards");
  if(!list.length){
    if(!q && storageState==="error"){
      out.innerHTML='<div class="empty"><b>Не удалось прочитать сохранённые карты</b><span>Данные не перезаписываются. Ошибка: '+esc(storageError)+'</span><button class="btn primary" onclick="exportStorageRecovery()">Выгрузить данные для восстановления</button></div>';
      return;
    }
    out.innerHTML='<div class="empty"><b>'+(q?"Ничего не найдено":"Кошелёк пока пуст")+'</b><span>'+(q?"Попробуйте другой запрос":"Добавьте первую карту кнопкой «Добавить карту»")+'</span></div>';
    return;
  }
  out.innerHTML=list.map(function(c){
    const mark=String(c.name||"?").trim().charAt(0).toUpperCase();
    const color=String(c.color||colors[0]);
    const logo=c.image?'<img class="cardLogo" src="'+esc(c.image)+'" alt="">':'<span class="cardLogoFallback">'+esc(mark)+'</span>';
    const cover=coverForCard(c);
    return '<button type="button" class="card '+esc(coverClass(c))+' '+esc(cardStyleClass(c))+'" data-id="'+esc(String(c.id))+'" data-mark="" style="--card-color:'+esc(color)+';'+esc(cardStyleInline(c))+'">'+logo+'<strong>'+esc(c.name)+'</strong></button>';
  }).join("");
}
document.getElementById("cards").addEventListener("click",function(e){
  const card=e.target.closest(".card");
  if(!card)return;
  e.preventDefault();
  e.stopPropagation();
  openCard(card.getAttribute("data-id"));
});
function openModal(html){
  document.getElementById("sheet").innerHTML=html;
  document.getElementById("modal").classList.add("open");
}
function closeModal(){document.getElementById("modal").classList.remove("open");}
function addMenu(){
  openModal('<button class="close" onclick="closeModal()">×</button><h2>Добавить карту</h2>'+
    '<button class="btn primary" onclick="scanner()">▣ Сканировать штрихкод / QR</button>'+
    '<button class="btn secondary" onclick="manual()">Ввести данные вручную</button>'+
    '<button class="btn secondary" onclick="exportData()">Сохранить резервную копию</button>'+
    '<button class="btn secondary" onclick="importData()">Восстановить из файла</button>'+
    '<input id="importFile" type="file" accept="application/json,.json" style="display:none" onchange="readImport(event)">'+
    '<p class="hint">Карта сохраняется локально в этом браузере. На iPhone камера работает через HTTPS после разрешения доступа.</p>');
}
function manual(data){
  data=data||{};
  const fmt=data.format||"CODE_128";
  openModal('<button class="close" onclick="addMenu()">×</button><h2>Новая скидочная карта</h2>'+
    '<input id="name" name="discount_name" autocomplete="off" placeholder="Название карты" value="'+esc(data.name)+'">'+
    '<div class="row"><input id="code" name="discount_code" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Код штрихкода или QR-кода" value="'+esc(data.code)+'">'+
    '<div class="formatPicker"><input id="format" type="hidden" value="'+esc(fmt)+'"><button type="button" class="formatButton" onclick="toggleFormatMenu()">'+esc(formatLabel(fmt))+'</button><div id="formatMenu" class="formatMenu">'+
    '<button type="button" class="formatOption" onclick="chooseFormat(\'CODE_128\',\'Штрихкод — CODE 128\')">Штрихкод — CODE 128</button>'+
    '<button type="button" class="formatOption" onclick="chooseFormat(\'EAN_13\',\'Штрихкод — EAN-13\')">Штрихкод — EAN-13</button>'+
    '<button type="button" class="formatOption" onclick="chooseFormat(\'EAN_8\',\'Штрихкод — EAN-8\')">Штрихкод — EAN-8</button>'+
    '<button type="button" class="formatOption" onclick="chooseFormat(\'QR_CODE\',\'QR-код\')">QR-код</button></div></div></div>'+
    '<div class="coverPicker"><div class="hint">Рубашка карты</div><input id="cover" type="hidden" value="AUTO"><div id="coverGrid" class="coverGrid">'+coverOptions("AUTO")+'</div><div class="coverHint">Автоматически выберется знакомая рубашка по названию магазина. Её можно заменить вручную.</div></div>'+styleEditor({style:{}})+''+
    '<label class="hint" style="display:block;margin-top:12px">Фото карты<input id="cardImage" type="file" accept="image/*" style="width:100%;margin-top:6px"></label>'+
    '<button class="btn primary" onclick="addCard()">Сохранить карту</button>');
  bindCoverPicker();
  bindStyleEditor();
}
function formatLabel(v){return ({CODE_128:"Штрихкод — CODE 128",EAN_13:"Штрихкод — EAN-13",EAN_8:"Штрихкод — EAN-8",QR_CODE:"QR-код"})[v]||"Штрихкод — CODE 128";}
function toggleFormatMenu(){const m=document.getElementById("formatMenu");if(m)m.classList.toggle("open");}
function chooseFormat(v,label){const f=document.getElementById("format");const btn=document.querySelector(".formatButton");const m=document.getElementById("formatMenu");if(f)f.value=v;if(btn)btn.textContent=label;if(m)m.classList.remove("open");}
async function addCard(){
  const name=document.getElementById("name").value.trim()||"Моя карта";
  const code=document.getElementById("code").value.trim();
  const format=document.getElementById("format").value;
  const cover=(document.getElementById("cover")&&document.getElementById("cover").value)||"AUTO";
  const style={palette:(document.getElementById("cardPalette")&&document.getElementById("cardPalette").value)||"AUTO",textColor:(document.getElementById("titleColor")&&document.getElementById("titleColor").value)||"WHITE",position:(document.getElementById("titlePosition")&&document.getElementById("titlePosition").value)||"CENTER",size:Math.max(14,Math.min(28,Number(document.getElementById("titleSize")&&document.getElementById("titleSize").value)||19)),font:(document.getElementById("titleFont")&&document.getElementById("titleFont").value)||"SYSTEM"};
  const file=document.getElementById("cardImage")&&document.getElementById("cardImage").files[0];
  if(!code){alert("Введите код карты");return;}
  let image="";
  if(file)image=await readImage(file);
  cards.unshift({id:String(Date.now()),name:name,code:code,format:format,image:image,color:colors[cards.length%colors.length],cover:cover,style:style});
  save();
  closeModal();
}
function scanner(onResult){
  openModal('<button class="close" onclick="closeModal()">×</button><h2>Сканирование скидочной карты</h2><div id="reader"></div><div class="scanTools"><button class="btn primary galleryPrimary" onclick="document.getElementById(\'scanFile\').click()">▣ Сканировать фото из галереи</button><input id="scanFile" type="file" accept="image/*" style="display:none"><p class="hint">Наведите камеру на QR/штрихкод — распознавание происходит автоматически.</p></div>');
  let controls=null,handled=false,reader=null,detector=null,raf=0,video=null,lastKey="",stableHits=0;
  const formats=["qr_code","code_128","code_39","code_93","ean_13","ean_8","upc_a","upc_e","itf","data_matrix","pdf417"];

async function decodeGalleryFile(file,reader,finish){

        const found=await detector.detect(img);
        if(found&&found.length){finish(found[0].rawValue,found[0].format);return;}
      }catch(e){}
    }
    if(reader){
      try{
        const result=await reader.decodeFromImageElement(img);

          finish(result.getText?result.getText():result.text,result.getBarcodeFormat?result.getBarcodeFormat():"QR_CODE");

}function normalizeFormat(value){
  const s=String(value||"").toUpperCase().replace(/[\s-]+/g,"_");
  if(s==="QR"||s==="QRCODE"||s==="QR_CODE")return "QR_CODE";
  if(s==="EAN13"||s==="EAN_13")return "EAN_13";
  if(s==="EAN8"||s==="EAN_8")return "EAN_8";
  if(s==="CODE128"||s==="CODE_128")return "CODE_128";
  if(s==="CODE39"||s==="CODE_39")return "CODE_39";
  if(s==="CODE93"||s==="CODE_93")return "CODE_93";
  if(s==="UPC_A"||s==="UPCA")return "UPC_A";
  if(s==="UPC_E"||s==="UPCE")return "UPC_E";
  if(s==="ITF")return "ITF";
  if(s==="DATA_MATRIX"||s==="DATAMATRIX")return "DATA_MATRIX";
  if(s==="PDF417"||s==="PDF_417")return "PDF417";
  return s||"CODE_128";
}

      const d=JSON.parse(r.result);
