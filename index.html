<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#17181c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:100px}header{padding:22px 18px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#f6f7fbf2;backdrop-filter:blur(15px);z-index:5}
h1{margin:0;font-size:28px}.sub{color:#737780;font-size:14px;margin-top:4px}.btn{border:0;border-radius:14px;padding:14px;font-weight:650}.icon{width:44px;height:44px;background:#fff;border:1px solid #e6e7eb;font-size:24px}.search{padding:8px 18px 16px}.search input,.sheet input{width:100%;padding:13px;border:1px solid #e2e3e8;border-radius:13px;background:#fff}.formatPicker{position:relative;flex:1}.formatButton{width:100%;padding:13px;border:1px solid #e2e3e8;border-radius:13px;background:#fff;color:#17181c;text-align:left;font:inherit}.formatMenu{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:50;background:#fff;border:1px solid #e2e3e8;border-radius:13px;box-shadow:0 10px 28px #0002;overflow:hidden}.formatMenu.open{display:block}.formatOption{display:block;width:100%;padding:13px 14px;border:0;border-bottom:1px solid #eee;background:#fff;color:#17181c;text-align:left;font:inherit}.formatOption:last-child{border-bottom:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 14px}.card{min-height:118px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--card-color,#17181c) 0%,var(--card-color,#17181c) 58%,#00000066 100%);border:0;border-radius:18px;padding:13px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 7px 18px #00000018;isolation:isolate}.card strong{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;line-height:1.12;padding:0;color:#fff;text-shadow:0 1px 2px #0008;text-align:center;width:88%}.card small,.card .code{display:none}.card:before{content:"";position:absolute;z-index:1;right:-22px;top:-30px;width:105px;height:105px;border-radius:50%;background:#ffffff20;box-shadow:-28px 34px 0 2px #ffffff12,38px 58px 0 -10px #ffffff10}.card:after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(120deg,#ffffff18 0%,#ffffff00 42%,#00000018 100%);pointer-events:none}.cardLogo{width:42px;height:42px;object-fit:contain;border-radius:12px;background:#fff;border:0;display:block;margin-bottom:auto;position:relative;z-index:3;padding:3px}.cardLogoFallback{display:none}.code{font:10px monospace;letter-spacing:1.2px;color:#fff}.empty{grid-column:1/-1;text-align:center;color:#737780;padding:50px 20px}.empty b{display:block;color:#17181c;font-size:19px;margin-bottom:8px}.fab{display:none}
.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.overlay.open{display:flex}.sheet{width:100%;max-width:720px;margin:auto;background:#fff;border-radius:26px 26px 0 0;padding:18px;max-height:90vh;overflow:auto}.sheet h2{margin:2px 0 18px}.close{float:right;border:0;background:#f0f1f4;border-radius:12px;width:38px;height:38px;font-size:20px}.primary{width:100%;background:#17181c;color:#fff;margin-top:10px}.secondary{width:100%;background:#f0f1f4;margin-top:10px}.danger{width:100%;background:#fff0ef;color:#d92d20;margin-top:10px}.row{display:flex;gap:10px;margin-top:10px}.row>*{flex:1}.detail{text-align:center}.brand{font-size:25px;font-weight:750;margin:8px}.codebox{background:#fff;border:1px solid #e6e7eb;border-radius:20px;padding:20px;margin:10px 0}.codebox svg{max-width:100%}.codeText{font:18px monospace;letter-spacing:2px;word-break:break-all;margin-top:12px}.hint{font-size:13px;color:#737780;line-height:1.45}#reader{width:100%;height:min(48vh,430px);min-height:260px;overflow:hidden;border-radius:18px;background:#111;position:relative}#reader video{width:100%!important;height:100%!important;object-fit:cover!important}#reader__scan_region{width:100%!important;height:100%!important}#reader__scan_region img{display:none!important}.scanTools{display:flex;flex-direction:column;gap:10px;margin-top:10px}.cropWrap{position:relative;width:100%;height:min(58vh,520px);min-height:300px;background:#111;border-radius:18px;overflow:hidden;touch-action:none}.cropImage{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}.cropShade{position:absolute;inset:0;background:#0007;pointer-events:none}.cropBox{position:absolute;width:78%;height:150px;left:11%;top:calc(50% - 75px);border:4px solid #fff;box-shadow:0 0 0 9999px #0005;z-index:2;touch-action:none;cursor:move}.cropHint{font-size:13px;color:#737780;line-height:1.4;text-align:center;margin:0}.cropControls{display:flex;gap:8px}.cropControls button{flex:1;background:#f0f1f4;color:#17181c;border:0;border-radius:12px;padding:11px;font-weight:650}.cropZoomValue{text-align:center;font-size:12px;color:#737780;margin-top:-4px}.galleryPrimary{position:sticky;bottom:0;z-index:4}
@media(max-width:720px){.fab{bottom:88px}}
@media(max-width:420px){.grid{gap:11px;padding:0 13px}.search{padding-left:13px;padding-right:13px}.card{min-height:112px;padding:12px}.card strong{font-size:20px;width:90%}}

<body>
<div class="app">
<header><div><h1>Мой кошелёк</h1><div class="sub" id="count">0 карт</div></div><button class="icon" onclick="addMenu()">＋</button></header>
<div class="search"><input id="search" placeholder="Поиск карты" oninput="render()"></div>
<main id="cards" class="grid"></main>
</div>
<button class="fab" onclick="addMenu()">＋</button>
<div id="modal" class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<script>
const KEY="card_wallet_v1";
const SAFE_KEY=KEY+"_safe_backup";
const colors=["#17181c","#3157d5","#16845b","#a35b17","#7b3db7","#c23b55"];
let cards=[];
let storageState="missing";
let storageError="";
try{
  const raw=localStorage.getItem(KEY);
  if(raw===null){
    cards=[];
    storageState="missing";
  }else{
    const parsed=JSON.parse(raw);
    if(!Array.isArray(parsed))throw new Error("локальная база имеет неверный формат");
    cards=parsed;
    storageState="ok";
    if(raw && cards.length){
      try{localStorage.setItem(SAFE_KEY,raw);}catch(e){}
    }
  }
}catch(e){
  storageState="error";
  storageError=String(e&&e.message||e);
  cards=[];
}

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];
  });
}
function save(){
  try{
    const current=localStorage.getItem(KEY);
    if(current){
      try{localStorage.setItem(SAFE_KEY,current);}catch(e){}
    }
    localStorage.setItem(KEY,JSON.stringify(cards));
    storageState="ok";
    storageError="";
  }catch(e){alert("Не удалось сохранить карту в памяти браузера");}
  render();
}
function exportStorageRecovery(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw){alert("В локальной памяти нет данных для восстановления.");return;}
    const blob=new Blob([raw],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="CARD_storage_recovery.json";
    a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  }catch(e){alert("Не удалось выгрузить данные локальной памяти");}
}
function readImage(file){
  return new Promise(function(resolve,reject){
    const r=new FileReader();
    r.onload=function(){resolve(String(r.result||""));};
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}
function render(){
  const search=document.getElementById("search");
  const q=(search.value||"").toLowerCase().trim();
  const list=cards.filter(function(c){
    return String(c.name||"").toLowerCase().includes(q)||String(c.code||"").toLowerCase().includes(q);
  });
  document.getElementById("count").textContent=cards.length+" карт";
  const out=document.getElementById("cards");
  if(!list.length){
    if(!q && storageState==="error"){
      out.innerHTML='<div class="empty"><b>Не удалось прочитать сохранённые карты</b><span>Данные не перезаписываются. Ошибка: '+esc(storageError)+'</span><button class="btn primary" onclick="exportStorageRecovery()">Выгрузить данные для восстановления</button></div>';
      return;
    }
    out.innerHTML='<div class="empty"><b>'+(q?"Ничего не найдено":"Кошелёк пока пуст")+'</b><span>'+(q?"Попробуйте другой запрос":"Добавьте первую карту кнопкой ＋")+'</span></div>';
    return;
  }
  out.innerHTML=list.map(function(c){
    const mark=String(c.name||"?").trim().charAt(0).toUpperCase();
    const color=String(c.color||colors[0]);
    const logo=c.image?'<img class="cardLogo" src="'+esc(c.image)+'" alt="">':'<span class="cardLogoFallback">'+esc(mark)+'</span>';
    return '<button type="button" class="card" data-id="'+esc(String(c.id))+'" data-mark="" style="--card-color:'+esc(color)+'">'+logo+'<strong>'+esc(c.name)+'</strong></button>';
  }).join("");
}
document.getElementById("cards").addEventListener("click",function(e){
  const card=e.target.closest(".card");
  if(!card)return;
  e.preventDefault();
  e.stopPropagation();
  openCard(card.getAttribute("data-id"));
});
function openModal(html){
  document.getElementById("sheet").innerHTML=html;
  document.getElementById("modal").classList.add("open");
}
function closeModal(){document.getElementById("modal").classList.remove("open");}
function addMenu(){
  openModal('<button class="close" onclick="closeModal()">×</button><h2>Добавить карту</h2>'+
    '<button class="btn primary" onclick="scanner()">▣ Сканировать штрихкод / QR</button>'+
    '<button class="btn secondary" onclick="manual()">Ввести данные вручную</button>'+
    '<button class="btn secondary" onclick="exportData()">Сохранить резервную копию</button>'+
    '<button class="btn secondary" onclick="importData()">Восстановить из файла</button>'+
    '<input id="importFile" type="file" accept="application/json,.json" style="display:none" onchange="readImport(event)">'+
    '<p class="hint">Карта сохраняется локально в этом браузере. На iPhone камера работает через HTTPS после разрешения доступа.</p>');
}
function manual(data){
  data=data||{};
  const fmt=data.format||"CODE_128";
  openModal('<button class="close" onclick="addMenu()">×</button><h2>Новая скидочная карта</h2>'+
    '<input id="name" name="discount_name" autocomplete="off" placeholder="Название карты" value="'+esc(data.name)+'">'+
    '<div class="row"><input id="code" name="discount_code" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Код штрихкода или QR-кода" value="'+esc(data.code)+'">'+
    '<div class="formatPicker"><input id="format" type="hidden" value="'+esc(fmt)+'"><button type="button" class="formatButton" onclick="toggleFormatMenu()">'+esc(formatLabel(fmt))+'</button><div id="formatMenu" class="formatMenu">'+
    '<button type="button" class="formatOption" onclick="chooseFormat(\'CODE_128\',\'Штрихкод — CODE 128\')">Штрихкод — CODE 128</button>'+
    '<button type="button" class="formatOption" onclick="chooseFormat(\'EAN_13\',\'Штрихкод — EAN-13\')">Штрихкод — EAN-13</button>'+
    '<button type="button" class="formatOption" onclick="chooseFormat(\'EAN_8\',\'Штрихкод — EAN-8\')">Штрихкод — EAN-8</button>'+
    '<button type="button" class="formatOption" onclick="chooseFormat(\'QR_CODE\',\'QR-код\')">QR-код</button></div></div></div>'+
    '<label class="hint" style="display:block;margin-top:12px">Фото карты<input id="cardImage" type="file" accept="image/*" style="width:100%;margin-top:6px"></label>'+
    '<button class="btn primary" onclick="addCard()">Сохранить карту</button>');
}
function formatLabel(v){return ({CODE_128:"Штрихкод — CODE 128",EAN_13:"Штрихкод — EAN-13",EAN_8:"Штрихкод — EAN-8",QR_CODE:"QR-код"})[v]||"Штрихкод — CODE 128";}
function toggleFormatMenu(){const m=document.getElementById("formatMenu");if(m)m.classList.toggle("open");}
function chooseFormat(v,label){const f=document.getElementById("format");const btn=document.querySelector(".formatButton");const m=document.getElementById("formatMenu");if(f)f.value=v;if(btn)btn.textContent=label;if(m)m.classList.remove("open");}
async function addCard(){
  const name=document.getElementById("name").value.trim()||"Моя карта";
  const code=document.getElementById("code").value.trim();
  const format=document.getElementById("format").value;
  const file=document.getElementById("cardImage")&&document.getElementById("cardImage").files[0];
  if(!code){alert("Введите код карты");return;}
  let image="";
  if(file)image=await readImage(file);
  cards.unshift({id:String(Date.now()),name:name,code:code,format:format,image:image,color:colors[cards.length%colors.length]});
  save();
  closeModal();
}
function scanner(){
  openModal('<button class="close" onclick="closeModal()">×</button><h2>Сканирование скидочной карты</h2>'+
    '<div id="reader"></div>'+
    '<div class="scanTools">'+
    '<button class="btn primary galleryPrimary" onclick="document.getElementById(\'scanFile\').click()">▣ Сканировать фото из галереи</button>'+
    '<input id="scanFile" type="file" accept="image/*" style="display:none">'+
    '<p class="hint">Наведите камеру на QR/штрихкод — распознавание происходит автоматически.</p></div>');
  let controls=null,handled=false,reader=null,detector=null,raf=0,video=null;
  const formats=["qr_code","code_128","code_39","code_93","ean_13","ean_8","upc_a","upc_e","itf","data_matrix","pdf417"];

  function mapFormat(raw){
    const s=String(raw||"").toUpperCase();
    if(s.indexOf("QR")>=0||s.indexOf("DATA_MATRIX")>=0)return "QR_CODE";
    if(s.indexOf("EAN_13")>=0)return "EAN_13";
    if(s.indexOf("EAN_8")>=0)return "EAN_8";
    if(s.indexOf("CODE_128")>=0)return "CODE_128";
    if(s.indexOf("CODE_39")>=0||s.indexOf("CODE_93")>=0)return "CODE_128";
    if(s.indexOf("UPC_A")>=0)return "EAN_13";
    if(s.indexOf("UPC_E")>=0)return "EAN_8";
    return "CODE_128";
  }
  function finish(text,raw){
    if(handled||!text)return;
    handled=true;
    if(raf)cancelAnimationFrame(raf);
    try{if(controls)controls.stop();}catch(e){}
    try{if(reader&&reader.reset)reader.reset();}catch(e){}
    try{if(video&&video.srcObject){video.srcObject.getTracks().forEach(function(t){t.stop();});video.srcObject=null;}}catch(e){}
    closeModal();
    setTimeout(function(){manual({code:String(text),format:mapFormat(raw)});},100);
  }

  async function nativeLoop(){
    if(!detector||!video||handled)return;
    try{
      const found=await detector.detect(video);
      if(found&&found.length){
        const x=found[0];
        finish(x.rawValue,x.format);
        return;
      }
    }catch(e){}
    if(!handled)raf=requestAnimationFrame(nativeLoop);
  }

  if("BarcodeDetector" in window){
    BarcodeDetector.getSupportedFormats().then(function(supported){
      const use=formats.filter(function(x){return supported.indexOf(x)>=0;});
      if(use.length)detector=new BarcodeDetector({formats:use});
      if(video && video.readyState>=2 && !handled) nativeLoop();
    }).catch(function(){detector=null;});
  }

  try{reader=new ZXingBrowser.BrowserMultiFormatReader();}catch(e){reader=null;}

  const readerBox=document.getElementById("reader");
  video=document.createElement("video");
  video.setAttribute("playsinline","");
  video.setAttribute("autoplay","");
  video.setAttribute("muted","");
  video.muted=true;
  video.style.width="100%";video.style.height="100%";video.style.objectFit="cover";
  readerBox.appendChild(video);

  navigator.mediaDevices.getUserMedia({
    video:{
      facingMode:{ideal:"environment"},
      width:{ideal:1920},
      height:{ideal:1080},
      focusMode:"continuous"
    },
    audio:false
  }).then(function(stream){
    video.srcObject=stream;
    return video.play();
  }).then(function(){
    if(detector)nativeLoop();
    if(reader){
      return reader.decodeFromVideoElement(video,function(result){
        if(result){
          const text=result.getText?result.getText():result.text;
          const fmt=result.getBarcodeFormat?result.getBarcodeFormat():"QR_CODE";
          finish(text,fmt);
        }
      }).then(function(c){controls=c;});
    }
  }).catch(function(){
    readerBox.innerHTML='<p style="padding:30px;color:white;text-align:center">Камера недоступна. Можно выбрать фото из галереи.</p>';
  });

  document.getElementById("scanFile").onchange=async function(e){
    const file=e.target.files[0];
    if(!file||handled)return;
    try{
      if(raf)cancelAnimationFrame(raf);
      try{if(controls)controls.stop();}catch(x){}
      await decodeGalleryFile(file,reader,finish);
    }catch(err){
      alert("Код не найден. Увеличьте фото, переместите рамку на код и попробуйте снова.");
    }
    e.target.value="";
  };
}

async function decodeGalleryFile(file,reader,finish){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();
    img.src=url;
    await new Promise(function(resolve,reject){img.onload=resolve;img.onerror=reject;});
    if("BarcodeDetector" in window){
      try{
        const supported=await BarcodeDetector.getSupportedFormats();
        const detector=new BarcodeDetector({formats:supported});
        const found=await detector.detect(img);
        if(found&&found.length){finish(found[0].rawValue,found[0].format);return;}
      }catch(e){}
    }
    if(reader){
      try{
        const result=await reader.decodeFromImageElement(img);
        if(result){
          finish(result.getText?result.getText():result.text,result.getBarcodeFormat?result.getBarcodeFormat():"QR_CODE");
          return;
        }
      }catch(e){}
    }
    showCropper(file,reader,finish);
  }finally{
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
  }
}

function showCropper(file,reader,finish){
  const readerBox=document.getElementById("reader");
  if(!readerBox)return;
  const url=URL.createObjectURL(file);
  readerBox.innerHTML='<div class="cropWrap" id="cropWrap"><img id="cropImage" class="cropImage" alt=""><div class="cropBox" id="cropBox"></div></div>'+
    '<div class="cropControls"><button type="button" id="zoomOut">−</button><button type="button" id="zoomReset">100%</button><button type="button" id="zoomIn">+</button></div>'+
    '<div class="cropZoomValue" id="zoomValue">Масштаб 100%</div>'+
    '<p class="cropHint">Увеличивайте фото двумя пальцами и двигайте его под рамкой. Рамку тоже можно перетащить.</p>'+
    '<button class="btn primary" id="cropScan">Распознать выбранную область</button><button class="btn secondary" id="cropBack">Назад к камере</button>';
  const img=document.getElementById("cropImage"),box=document.getElementById("cropBox");
  img.src=url;
  let drag=false,sx=0,sy=0,sl=0,st=0;
  box.addEventListener("pointerdown",function(e){e.preventDefault();drag=true;sx=e.clientX;sy=e.clientY;const r=box.getBoundingClientRect();sl=r.left;st=r.top;try{box.setPointerCapture(e.pointerId);}catch(x){}});
  box.addEventListener("pointermove",function(e){if(!drag)return;e.preventDefault();const w=document.getElementById("cropWrap").getBoundingClientRect();let x=sl+e.clientX-sx-w.left,y=st+e.clientY-sy-w.top;x=Math.max(0,Math.min(x,w.width-box.offsetWidth));y=Math.max(0,Math.min(y,w.height-box.offsetHeight));box.style.left=x+"px";box.style.top=y+"px";});
  ["pointerup","pointercancel"].forEach(function(ev){box.addEventListener(ev,function(){drag=false;});});
  let scale=1,tx=0,ty=0,pinch=false,pStart=1,sStart=1;
  function apply(){img.style.transform="translate("+tx+"px,"+ty+"px) scale("+scale+")";document.getElementById("zoomValue").textContent="Масштаб "+Math.round(scale*100)+"%";document.getElementById("zoomReset").textContent=Math.round(scale*100)+"%";}
  function clamp(){const w=document.getElementById("cropWrap");tx=Math.max(-(w.clientWidth*(scale-1))/2,Math.min((w.clientWidth*(scale-1))/2,tx));ty=Math.max(-(w.clientHeight*(scale-1))/2,Math.min((w.clientHeight*(scale-1))/2,ty));}
  function setScale(v){scale=Math.max(1,Math.min(5,v));clamp();apply();}
  document.getElementById("zoomIn").onclick=function(){setScale(scale+.25);};
  document.getElementById("zoomOut").onclick=function(){setScale(scale-.25);};
  document.getElementById("zoomReset").onclick=function(){scale=1;tx=0;ty=0;apply();};
  img.addEventListener("touchstart",function(e){if(e.touches.length===2){e.preventDefault();pinch=true;const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;pStart=Math.hypot(dx,dy);sStart=scale;}},{passive:false});
  img.addEventListener("touchmove",function(e){if(!pinch||e.touches.length!==2)return;e.preventDefault();const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;scale=Math.max(1,Math.min(5,sStart*(Math.hypot(dx,dy)/pStart)));clamp();apply();},{passive:false});
  img.addEventListener("touchend",function(e){if(e.touches.length<2)pinch=false;});
  document.getElementById("cropBack").onclick=function(){URL.revokeObjectURL(url);scanner();};
  document.getElementById("cropScan").onclick=async function(){
    const btn=this;btn.disabled=true;btn.textContent="Распознавание…";
    try{
      const br=box.getBoundingClientRect(),ir=img.getBoundingClientRect(),nw=img.naturalWidth,nh=img.naturalHeight;
      const sx=Math.max(0,(br.left-ir.left)/ir.width*nw),sy=Math.max(0,(br.top-ir.top)/ir.height*nh);
      const sw=Math.min(nw-sx,br.width/ir.width*nw),sh=Math.min(nh-sy,br.height/ir.height*nh);
      const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(sw));canvas.height=Math.max(1,Math.round(sh));
      canvas.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
      const dataUrl=canvas.toDataURL("image/png");
      if("BarcodeDetector" in window){
        try{
          const ci=new Image();ci.src=dataUrl;await new Promise(function(r,j){ci.onload=r;ci.onerror=j;});
          const detector=new BarcodeDetector({formats:await BarcodeDetector.getSupportedFormats()});
          const found=await detector.detect(ci);
          if(found&&found.length){finish(found[0].rawValue,found[0].format);return;}
        }catch(e){}
      }
      if(reader){
        const ci=new Image();ci.src=dataUrl;await new Promise(function(r,j){ci.onload=r;ci.onerror=j;});
        const result=await reader.decodeFromImageElement(ci);
        if(result){finish(result.getText?result.getText():result.text,result.getBarcodeFormat?result.getBarcodeFormat():"QR_CODE");return;}
      }
      throw Error("not-found");
    }catch(e){
      btn.disabled=false;btn.textContent="Распознать выбранную область";
      alert("Код не найден в этой области. Увеличьте фото или передвиньте рамку точно на QR/штрихкод.");
    }
  };

  const c=cards.find(function(x){return String(x.id)===String(id);});

    '<div class="formatPicker" style="margin-top:10px"><input id="format" type="hidden" value="'+esc(c.format||"CODE_128")+'"><button type="button" class="formatButton" onclick="toggleFormatMenu()">'+esc(formatLabel(c.format||"CODE_128"))+'</button><div id="formatMenu" class="formatMenu">'+

    '<button type="button" class="formatOption" onclick="chooseFormat(\'EAN_13\',\'Штрихкод — EAN-13\')">Штрихкод — EAN-13</button>'+
    '<button type="button" class="formatOption" onclick="chooseFormat(\'EAN_8\',\'Штрихкод — EAN-8\')">Штрихкод — EAN-8</button>'+
    '<button type="button" class="formatOption" onclick="chooseFormat(\'QR_CODE\',\'QR-код\')">QR-код</button></div></div>'+
    '<label class="hint" style="display:block;margin-top:12px">Заменить фото карты<input id="cardImage" type="file" accept="image/*" style="width:100%;margin-top:6px"></label>'+
    '<button class="btn primary" onclick="updateCard('+JSON.stringify(String(id))+')">Сохранить</button>'+
    '<button class="btn secondary" onclick="closeModal()">Отмена</button>');
}
async function updateCard(id){
  const c=cards.find(function(x){return String(x.id)===String(id);});
  if(!c)return;
  c.name=document.getElementById("name").value.trim()||"Моя карта";
  c.code=document.getElementById("code").value.trim();
  c.format=document.getElementById("format").value;
  const file=document.getElementById("cardImage")&&document.getElementById("cardImage").files[0];
  if(file)c.image=await readImage(file);
  save();
  closeModal();
}
function delCard(id){
  if(confirm("Удалить эту карту?")){
    cards=cards.filter(function(c){return String(c.id)!==String(id);});
    save();
    closeModal();
  }
}
function exportData(){
  const blob=new Blob([JSON.stringify({version:1,cards:cards},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="CARD_backup.json";
  a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}
function importData(){document.getElementById("importFile").click();}
function readImport(e){
  const f=e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const d=JSON.parse(r.result);
      const list=Array.isArray(d)?d:d.cards;
      if(!Array.isArray(list))throw Error();
      cards=list.filter(function(c){return c&&c.code;}).map(function(c){
        return {id:String(c.id||Date.now()+Math.random()),name:String(c.name||"Моя карта"),code:String(c.code),format:String(c.format||"CODE_128"),image:String(c.image||""),color:String(c.color||colors[0])};
      });
      save();
      closeModal();
      alert("Карты восстановлены: "+cards.length);
    }catch(x){alert("Не удалось прочитать резервную копию");}
  };
  r.readAsText(f);
  e.target.value="";
}
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js?v=29").catch(function(){});});
}
render();
