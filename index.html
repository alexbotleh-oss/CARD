let storageState="missing";
let storageError="";
try{
  const raw=localStorage.getItem(KEY);
  if(raw===null){
    cards=[];
    storageState="missing";
  }else{
    const parsed=JSON.parse(raw);
    if(!Array.isArray(parsed))throw new Error("локальная база имеет неверный формат");
    cards=parsed;
    storageState="ok";
    if(raw && cards.length){
      try{localStorage.setItem(SAFE_KEY,raw);}catch(e){}
    }
  }
}catch(e){
  storageState="error";
  storageError=String(e&&e.message||e);
  cards=[];
}

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];
  });
}
function save(){

    storageState="ok";
    storageError="";
  }catch(e){alert("Не удалось сохранить карту в памяти браузера");}
  render();
}

function readCoverImage(file){
  return new Promise(function(resolve,reject){
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      try{
        const maxW=1400,maxH=900,scale=Math.min(1,maxW/img.naturalWidth,maxH/img.naturalHeight);
        const canvas=document.createElement("canvas");
        canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
        canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
        const data=canvas.toDataURL("image/webp",0.86);
        URL.revokeObjectURL(url);resolve(data.indexOf("data:image/webp")===0?data:canvas.toDataURL("image/png"));
      }catch(err){URL.revokeObjectURL(url);reject(err);}
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(Error("cover-image-decode-failed"));};
    img.src=url;
  });
}
function readImage(file){

    r.readAsDataURL(file);
  });
}
function syncCardsFromStorage(){
  try{
    let raw=localStorage.getItem(KEY);
    let parsed=null;
    if(raw){
      try{parsed=JSON.parse(raw);}catch(e){parsed=null;}
    }
    if(!Array.isArray(parsed)){
      const sources=[localStorage,sessionStorage];
      for(let si=0;si<sources.length&&!Array.isArray(parsed);si++){
        const st=sources[si];
        for(let i=0;i<st.length;i++){
          const k=st.key(i);
          if(!k||k===KEY||k===SAFE_KEY)continue;
          try{
            const v=JSON.parse(st.getItem(k));
            const a=Array.isArray(v)?v:(v&&Array.isArray(v.cards)?v.cards:null);
            if(Array.isArray(a)&&a.some(function(x){return x&&typeof x==="object"&&(x.code||x.barcode||x.number||x.cardNumber);})){
              parsed=a;
              break;
            }
          }catch(e){}
        }
      }
    }
    if(!Array.isArray(parsed))return false;
    const normalized=parsed.filter(function(x){return x&&typeof x==="object"&&(x.code||x.barcode||x.number||x.cardNumber);}).map(function(x){
      return {
        id:String(x.id||Date.now()+Math.random()),
        name:String(x.name||x.title||"Моя карта"),
        code:String(x.code||x.barcode||x.number||x.cardNumber),
        format:String(x.format||"CODE_128"),
        image:String(x.image||x.logo||""),
        color:String(x.color||colors[0]),
        cover:String(x.cover||"AUTO"),
        coverImage:String(x.coverImage||""),
        style:(x.style&&typeof x.style==="object")?x.style:{}
      };
    });
    if(!normalized.length)return false;
    cards=normalized;
    try{localStorage.setItem(KEY,JSON.stringify(cards));}catch(e){}
    storageState="ok";
    storageError="";
    return true;
  }catch(e){
    storageState="error";
    storageError=String(e&&e.message||e);
    return false;
  }
}

}function normalizeFormat(value){
  const s=String(value||"").toUpperCase().replace(/[\s-]+/g,"_");

  if(s==="EAN13"||s==="EAN_13")return "EAN_13";
  if(s==="EAN8"||s==="EAN_8")return "EAN_8";
  if(s==="CODE128"||s==="CODE_128")return "CODE_128";
  if(s==="CODE39"||s==="CODE_39")return "CODE_39";
  if(s==="CODE93"||s==="CODE_93")return "CODE_93";
  if(s==="UPC_A"||s==="UPCA")return "UPC_A";
  if(s==="UPC_E"||s==="UPCE")return "UPC_E";
  if(s==="ITF")return "ITF";
  if(s==="DATA_MATRIX"||s==="DATAMATRIX")return "DATA_MATRIX";
  if(s==="PDF417"||s==="PDF_417")return "PDF417";
  return s||"CODE_128";
}

function refreshEditorCodePreview(c){
  const host=document.querySelector(".editorCodePreview");
  const el=document.getElementById("editorBarcode");
  const qr=document.getElementById("editorQrPreview");
  const code=document.getElementById("code");
  const fmt=document.getElementById("format");
  if(!host||!el)return;
  const value=String(code&&code.value||c&&c.code||"").trim();
  const format=normalizeFormat(fmt&&fmt.value||c&&c.format||"CODE_128");
  el.style.display="none";
  el.innerHTML="";
  if(qr){qr.innerHTML="";qr.style.display="none";}
  host.querySelectorAll("canvas.editorCodeCanvas,.editorCodePreviewStatus").forEach(function(n){n.remove();});
  function showStatus(message){
    const status=document.createElement("div");
    status.className="editorCodePreviewStatus hint";
    status.style.cssText="padding:12px;text-align:center";
    status.textContent=message;
    host.appendChild(status);
  }
  if(!value){showStatus("Введите код, чтобы увидеть предпросмотр.");return;}
  if(format==="QR_CODE"){
    if(!qr){showStatus("Поле предпросмотра QR-кода недоступно.");return;}
    qr.style.display="flex";
    try{
      if(typeof QRCode!=="function")throw Error("QRCode unavailable");
      new QRCode(qr,{text:value,width:190,height:190,correctLevel:(QRCode.CorrectLevel&&QRCode.CorrectLevel.M)||2});
    }catch(e){qr.textContent="Не удалось построить QR-код. Проверьте подключение генератора.";}
    return;
  }
  if(format==="PDF417"||format==="DATA_MATRIX"){
    if(!qr){showStatus("Поле предпросмотра 2D-кода недоступно.");return;}
    qr.style.display="flex";
    try{
      if(typeof bwipjs==="undefined")throw Error("bwip-js unavailable");
      const canvas=document.createElement("canvas");
      canvas.className="editorCodeCanvas";
      canvas.style.cssText="display:block;max-width:100%;height:auto;margin:0 auto";
      qr.appendChild(canvas);
      bwipjs.toCanvas(canvas,{bcid:format==="PDF417"?"pdf417":"datamatrix",text:value,scale:3,includetext:false,backgroundcolor:"FFFFFF",barcolor:"000000",padding:8});
    }catch(e){qr.textContent="Не удалось построить "+format+". Проверьте подключение генератора и значение кода.";}
    return;
  }
  const formats={CODE_128:"CODE128",CODE_39:"CODE39",CODE_93:"CODE93",EAN_13:"EAN13",EAN_8:"EAN8",ITF:"ITF",UPC_A:"UPC",UPC_E:"UPCE"};
  const jsFormat=formats[format];
  if(!jsFormat){showStatus("Предпросмотр формата "+format+" не поддерживается. Код не будет подменён другим форматом.");return;}
  try{
    JsBarcode(el,value,{format:jsFormat,displayValue:false,height:64,width:2,margin:4});
    el.style.display="";
  }catch(e){
    showStatus("Значение не соответствует формату "+format+". Проверьте код или выберите корректный формат.");
  }
}

    try{if(oldCardsRaw===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,oldCardsRaw);}catch(rollbackError){}
    try{if(oldSafeRaw===null)localStorage.removeItem(SAFE_KEY);else localStorage.setItem(SAFE_KEY,oldSafeRaw);}catch(rollbackError){}
    try{if(oldCoversRaw===null)localStorage.removeItem(COVER_DEFAULTS_KEY);else localStorage.setItem(COVER_DEFAULTS_KEY,oldCoversRaw);}catch(rollbackError){}
    cards=oldCards;brandCovers=oldBrandCovers;
    alert("Не удалось сохранить изменения. Проверьте свободное место в браузере; текущая карта в памяти не заменена.");
    return;
  }
  cards=nextCards;if(makeDefault)brandCovers=nextBrandCovers;
  storageState="ok";storageError="";render();closeModal();
}
function delCard(id){
  const c=cards.find(function(x){return String(x.id)===String(id);});
  if(!c)return;
  if(!confirm("Удалить карту «"+String(c.name||"Моя карта")+"»?\n\nЭто действие нельзя отменить."))return;
  cards=cards.filter(function(c){return String(c.id)!==String(id);});
  save();
  closeModal();
}
function exportData(){
  const blob=new Blob([JSON.stringify({version:2,cards:cards,brandCovers:brandCovers},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);

  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}
function importData(){const input=document.getElementById("importFile");if(!input){alert("Не найдено поле выбора резервной копии");return;}input.onchange=readImport;input.value="";input.click();}
function readImport(e){
  const input=e&&e.target;
  const f=input&&input.files&&input.files[0];
  if(!f)return;
  const reader=new FileReader();
  reader.onload=function(){
    try{
      const d=JSON.parse(reader.result);
      const list=Array.isArray(d)?d:(d&&d.cards);
      if(!Array.isArray(list))throw new Error("В резервной копии нет списка карт.");
      const importedCards=list.filter(function(c){return c&&typeof c==="object"&&String(c.code||"").trim();}).map(function(c){
        return {id:String(c.id||Date.now()+Math.random()),name:String(c.name||"Моя карта"),code:String(c.code).trim(),format:String(c.format||"CODE_128"),secondCode:String(c.secondCode||""),secondFormat:String(c.secondFormat||"CODE_128"),image:String(c.image||""),color:String(c.color||colors[0]),cover:String(c.cover||"AUTO"),coverImage:String(c.coverImage||""),style:(c.style&&typeof c.style==="object"&&!Array.isArray(c.style))?c.style:{}};
      });
      if(!importedCards.length)throw new Error("В резервной копии нет пригодных карт.");
      const importedCovers=(!Array.isArray(d)&&d.brandCovers&&typeof d.brandCovers==="object"&&!Array.isArray(d.brandCovers))?d.brandCovers:null;
      if(!confirm("Восстановить "+importedCards.length+" карт? Текущий набор карт будет заменён."))return;
      const oldCardsRaw=localStorage.getItem(KEY);
      const oldSafeRaw=localStorage.getItem(SAFE_KEY);
      const oldCoversRaw=localStorage.getItem(COVER_DEFAULTS_KEY);
      const nextCardsRaw=JSON.stringify(importedCards);
      const nextCoversRaw=importedCovers?JSON.stringify(importedCovers):oldCoversRaw;
      try{
        try{localStorage.setItem(SAFE_KEY,oldCardsRaw!==null?oldCardsRaw:JSON.stringify(cards));}catch(snapshotError){}
        localStorage.setItem(KEY,nextCardsRaw);
        if(importedCovers)localStorage.setItem(COVER_DEFAULTS_KEY,nextCoversRaw);
      }catch(saveError){
        const rollbackErrors=[];
        function restoreStorageKey(key,raw){
          try{
            localStorage.removeItem(key);
            if(raw!==null)localStorage.setItem(key,raw);
          }catch(rollbackError){rollbackErrors.push(key+": "+String(rollbackError&&rollbackError.message||rollbackError));}
        }
        restoreStorageKey(KEY,oldCardsRaw);
        restoreStorageKey(COVER_DEFAULTS_KEY,oldCoversRaw);
        restoreStorageKey(SAFE_KEY,oldSafeRaw);
        const suffix=rollbackErrors.length?" ОШИБКА отката для "+rollbackErrors.join(", ")+". Не закрывайте страницу; попробуйте экспортировать данные для восстановления.":" Старые сохранённые данные восстановлены.";
        alert("Не удалось восстановить резервную копию. "+String(saveError&&saveError.message||saveError)+"."+suffix);
        return;
      }
      cards=importedCards;
      if(importedCovers)brandCovers=importedCovers;
      storageState="ok";storageError="";
      render();
      closeModal();
      alert("Карты восстановлены: "+cards.length);
    }catch(x){alert("Не удалось прочитать резервную копию: "+String(x&&x.message||x));}
  };
  reader.onerror=function(){alert("Не удалось прочитать файл резервной копии.");};
  reader.readAsText(f);
  if(input)input.value="";
}

}
