/* CARD111 shared card standard: one geometry system for list cards and editor preview */
.card{
  container-type:inline-size;
  --card-ratio:1.48;
  aspect-ratio:var(--card-ratio)!important;
  min-height:0!important;
  padding:0!important;
}
.card strong{
  position:absolute!important;
  z-index:3!important;
  box-sizing:border-box!important;
  width:max-content;
  max-width:90%!important;
  margin:0!important;
  font-size:calc(var(--title-size,19) * 0.4348cqw)!important;
  font-family:var(--title-font,system-ui,-apple-system,"Segoe UI",sans-serif)!important;
  line-height:1.08!important;
  font-weight:750!important;
  white-space:normal!important;
  overflow-wrap:anywhere!important;
  padding:2.6cqw 4.35cqw!important;
  border-radius:4.35cqw!important;
  color:var(--title-color,#fff)!important;
  text-align:center!important;
  text-shadow:none!important;
  left:50%!important;
  right:auto!important;
  top:auto!important;
  bottom:4.8cqw!important;
  transform:translateX(-50%)!important;
}
/* Nine-point title anchoring: each position uses the same proportional inset */
.card[class*="title-top_"] strong{
  top:4.8cqw!important;bottom:auto!important;
}
.card.title-top_left strong,.card.title-middle_left strong,.card.title-bottom_left strong{
  left:4.8cqw!important;right:auto!important;transform:none!important;text-align:left!important;
}
.card.title-top_center strong,.card.title-center strong,.card.title-bottom_center strong{
  left:50%!important;right:auto!important;transform:translateX(-50%)!important;text-align:center!important;
}
.card.title-top_right strong,.card.title-middle_right strong,.card.title-bottom_right strong{
  left:auto!important;right:4.8cqw!important;transform:none!important;text-align:right!important;
}
.card.title-middle_left strong,.card.title-middle_right strong{
  top:50%!important;bottom:auto!important;transform:translateY(-50%)!important;
}
.card.title-center strong{top:50%!important;bottom:auto!important;transform:translate(-50%,-50%)!important}
.card.title-bottom_left strong,.card.title-bottom_center strong,.card.title-bottom_right strong{
  top:auto!important;bottom:4.8cqw!important;
}
.card.title-bottom_center strong{left:50%!important;right:auto!important;transform:translateX(-50%)!important}
.card.title-top_right strong,.card.title-bottom_right strong{transform:none!important}

function diagLog(event,details){try{const entry={time:new Date().toISOString(),event:String(event||"event"),details:details||{}};let a=[];try{a=JSON.parse(localStorage.getItem(DIAG_KEY)||"[]");if(!Array.isArray(a))a=[];}catch(e){}a.push(entry);if(a.length>DIAG_LIMIT)a=a.slice(-DIAG_LIMIT);localStorage.setItem(DIAG_KEY,JSON.stringify(a));}catch(e){try{console.warn("CARD111 diagnostic write failed",e);}catch(ignore){}}}

let cards=[];
let storageState="missing";
let storageError="";
try{
  const raw=localStorage.getItem(KEY);
  if(raw===null){
    cards=[];
    storageState="missing";
  }else{
    const parsed=JSON.parse(raw);
    if(!Array.isArray(parsed))throw new Error("локальная база имеет неверный формат");
    cards=parsed;
    storageState="ok";
    if(raw && cards.length){
      try{localStorage.setItem(SAFE_KEY,raw);}catch(e){}
    }
  }
}catch(e){
  storageState="error";
  storageError=String(e&&e.message||e);
  cards=[];
}

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];
  });
}
function save(){
  try{
    const current=localStorage.getItem(KEY);
    if(current){
      try{localStorage.setItem(SAFE_KEY,current);}catch(e){}
    }
    localStorage.setItem(KEY,JSON.stringify(cards));
    storageState="ok";
    storageError="";
  }catch(e){alert("Не удалось сохранить карту в памяти браузера");}

}
function exportStorageRecovery(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw){alert("В локальной памяти нет данных для восстановления.");return;}
    const blob=new Blob([raw],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="CARD_storage_recovery.json";
    a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  }catch(e){alert("Не удалось выгрузить данные локальной памяти");}
}
function readImage(file){
  return new Promise(function(resolve,reject){
    const r=new FileReader();
    r.onload=function(){resolve(String(r.result||""));};
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}
function syncCardsFromStorage(){
  try{
    let raw=localStorage.getItem(KEY);
    let parsed=null;
    if(raw){
      try{parsed=JSON.parse(raw);}catch(e){parsed=null;}
    }
    if(!Array.isArray(parsed)){
      const sources=[localStorage,sessionStorage];
      for(let si=0;si<sources.length&&!Array.isArray(parsed);si++){
        const st=sources[si];
        for(let i=0;i<st.length;i++){
          const k=st.key(i);
          if(!k||k===KEY||k===SAFE_KEY)continue;
          try{
            const v=JSON.parse(st.getItem(k));
            const a=Array.isArray(v)?v:(v&&Array.isArray(v.cards)?v.cards:null);
            if(Array.isArray(a)&&a.some(function(x){return x&&typeof x==="object"&&(x.code||x.barcode||x.number||x.cardNumber);})){
              parsed=a;
              break;
            }
          }catch(e){}
        }
      }
    }
    if(!Array.isArray(parsed))return false;
    const normalized=parsed.filter(function(x){return x&&typeof x==="object"&&(x.code||x.barcode||x.number||x.cardNumber);}).map(function(x){
      return {
        id:String(x.id||Date.now()+Math.random()),
        name:String(x.name||x.title||"Моя карта"),
        code:String(x.code||x.barcode||x.number||x.cardNumber),
        format:String(x.format||"CODE_128"),
        image:String(x.image||x.logo||""),
        color:String(x.color||colors[0]),
        cover:String(x.cover||"AUTO"),
        style:(x.style&&typeof x.style==="object")?x.style:{}
      };
    });
    if(!normalized.length)return false;
    cards=normalized;
    try{localStorage.setItem(KEY,JSON.stringify(cards));}catch(e){}
    storageState="ok";
    storageError="";
    return true;
  }catch(e){
    storageState="error";
    storageError=String(e&&e.message||e);
    return false;
  }
}
function render(){
  if(!cards.length)syncCardsFromStorage();
  const search=document.getElementById("search");
  const q=(search.value||"").toLowerCase().trim();
  const list=cards.filter(function(c){
    return String(c.name||"").toLowerCase().includes(q)||String(c.code||"").toLowerCase().includes(q);
  });
  document.getElementById("count").textContent=cards.length+" карт";
  const out=document.getElementById("cards");
  if(!list.length){
    if(!q && storageState==="error"){
      out.innerHTML='<div class="empty"><b>Не удалось прочитать сохранённые карты</b><span>Данные не перезаписываются. Ошибка: '+esc(storageError)+'</span><button class="btn primary" onclick="exportStorageRecovery()">Выгрузить данные для восстановления</button></div>';
      return;
    }
    out.innerHTML='<div class="empty"><b>'+(q?"Ничего не найдено":"Кошелёк пока пуст")+'</b><span>'+(q?"Попробуйте другой запрос":"Добавьте первую карту кнопкой «Добавить карту»")+'</span></div>';
    return;
  }
  out.innerHTML=list.map(function(c){
    const mark=String(c.name||"?").trim().charAt(0).toUpperCase();
    const color=String(c.color||colors[0]);
    const cover=coverForCard(c);
    const logo=c.image?'<img class="cardLogo" src="'+esc(c.image)+'" alt="">':brandMarkup(cover,c.name);
    return '<button type="button" class="card '+esc(coverClass(c))+' '+esc(cardStyleClass(c))+'" data-id="'+esc(String(c.id))+'" data-mark="" style="--card-color:'+esc(color)+';'+esc(cardStyleInline(c))+(cover==="CUSTOM"&&c.image?"background-image:url(&quot;"+esc(c.image)+"&quot;);":"")+'">'+logo+'<strong>'+esc(c.name)+'</strong></button>';
  }).join("");
}

async function addCard(){
  try{
    const nameEl=document.getElementById("name"),codeEl=document.getElementById("code"),formatEl=document.getElementById("format");
    if(!nameEl||!codeEl||!formatEl){alert("Не удалось открыть форму добавления карты.");return;}

    const format=formatEl.value||"CODE_128";
    const cover=(document.getElementById("cover")&&document.getElementById("cover").value)||"AUTO";
    const style={palette:(document.getElementById("cardPalette")&&document.getElementById("cardPalette").value)||"AUTO",textColor:(document.getElementById("titleColor")&&document.getElementById("titleColor").value)||"WHITE",position:(document.getElementById("titlePosition")&&document.getElementById("titlePosition").value)||"CENTER",background:(document.getElementById("titleBackground")&&document.getElementById("titleBackground").value)||"PILL",size:Math.max(14,Math.min(28,Number(document.getElementById("titleSize")&&document.getElementById("titleSize").value)||19)),font:(document.getElementById("titleFont")&&document.getElementById("titleFont").value)||"SYSTEM",visible:!(document.getElementById("titleVisible")&&document.getElementById("titleVisible").value==="false")};
    const file=document.getElementById("cardImage")&&document.getElementById("cardImage").files[0];

}function normalizeFormat(value){
  const s=String(value||"").toUpperCase().replace(/[\s-]+/g,"_");
  if(s==="QR"||s==="QRCODE"||s==="QR_CODE")return "QR_CODE";
  if(s==="EAN13"||s==="EAN_13")return "EAN_13";
  if(s==="EAN8"||s==="EAN_8")return "EAN_8";
  if(s==="CODE128"||s==="CODE_128")return "CODE_128";
  if(s==="CODE39"||s==="CODE_39")return "CODE_39";
  if(s==="CODE93"||s==="CODE_93")return "CODE_93";
  if(s==="UPC_A"||s==="UPCA")return "UPC_A";
  if(s==="UPC_E"||s==="UPCE")return "UPC_E";
  if(s==="ITF")return "ITF";
  if(s==="DATA_MATRIX"||s==="DATAMATRIX")return "DATA_MATRIX";
  if(s==="PDF417"||s==="PDF_417")return "PDF417";
  return s||"CODE_128";
}

      '<div class="coverPicker"><div class="hint">Выбор рубашки</div><input id="cover" type="hidden" value="'+esc(c.cover||"AUTO")+'">'+editorCoverCatalog(c.cover||"AUTO")+'<div class="coverHint">Авто — подбор по названию магазина.</div></div>'+
      styleEditor(c)+
    '</div>'+
    '<div class="editorPanel editorExtra" data-panel="extra">'+
      '<div class="editorSectionTitle">Дополнительно</div>'+
      '<button type="button" class="btn secondary" onclick="exportData()">Сохранить резервную копию</button>'+
      '<button type="button" class="btn secondary" onclick="importData()">Восстановить из файла</button>'+
      '<div class="hint">Резервные функции не изменяют текущую карту до подтверждения восстановления.</div>'+
    '</div>'+
    '<button type="button" class="btn primary" id="editSave">Сохранить</button>'+
    '<button type="button" class="btn secondary" id="editCancel">Отмена</button>');
  document.getElementById("editClose").onclick=function(){openCard(String(id));};
  document.getElementById("rescanEdit").onclick=function(){rescanEdit(String(id));};
  document.getElementById("editSave").onclick=function(){updateCard(String(id));};
  document.getElementById("editCancel").onclick=closeModal;
  bindCoverPicker();
  bindStyleEditor();
  bindEditorPreview(c);
  refreshEditorCodePreview(c);
}
function refreshEditorCodePreview(c){
  const el=document.getElementById("editorBarcode"), code=document.getElementById("code"), fmt=document.getElementById("format");
  if(!el)return;
  const value=String(code&&code.value||c&&c.code||"");
  const format=normalizeFormat(fmt&&fmt.value||c&&c.format||"CODE_128");
  if(format==="QR_CODE"){
    el.style.display="none";
    return;
  }
  el.style.display="";
  try{
    JsBarcode(el,value,{
      format:format==="EAN_13"?"ean13":format==="EAN_8"?"ean8":format==="CODE_39"?"CODE39":format==="ITF"?"ITF":format==="UPC_A"?"upc":format==="UPC_E"?"upce":"CODE128",
      displayValue:true,height:64,width:2,margin:4,fontSize:12
    });
  }catch(e){el.innerHTML="";}
}
function rescanEdit(id){
  scanner(function(data){
    const c=cards.find(function(x){return String(x.id)===String(id);});
    if(!c)return;
    manualEdit(id);
    const code=document.getElementById("code");
    const format=document.getElementById("format");
    if(code)code.value=data.code;
    if(format)format.value=data.format;
    const btn=document.querySelector(".formatButton");
    if(btn)btn.textContent=formatLabel(data.format);
    refreshEditorCodePreview(c);
  });
}
async function updateCard(id){
  const c=cards.find(function(x){return String(x.id)===String(id);});
  if(!c)return;
  const newName=document.getElementById("name").value.trim()||"Моя карта";
  const newCode=document.getElementById("code").value.trim();
  const newFormat=document.getElementById("format").value;
  const newCover=document.getElementById("cover")&&document.getElementById("cover").value||"AUTO";
  const newStyle={palette:(document.getElementById("cardPalette")&&document.getElementById("cardPalette").value)||"AUTO",textColor:(document.getElementById("titleColor")&&document.getElementById("titleColor").value)||"WHITE",position:(document.getElementById("titlePosition")&&document.getElementById("titlePosition").value)||"BOTTOM",background:(document.getElementById("titleBackground")&&document.getElementById("titleBackground").value)||"PILL",size:Math.max(14,Math.min(28,Number(document.getElementById("titleSize")&&document.getElementById("titleSize").value)||19)),font:(document.getElementById("titleFont")&&document.getElementById("titleFont").value)||"SYSTEM",visible:!(document.getElementById("titleVisible")&&document.getElementById("titleVisible").value==="false")};
  if(!newCode){alert("Введите код карты");return;}
  if(!confirm("Сохранить изменения карты «"+newName+"»?"))return;
  c.name=newName;
  c.code=newCode;
  c.format=newFormat;
  c.cover=newCover;
  c.style=newStyle;
  const file=document.getElementById("cardImage")&&document.getElementById("cardImage").files[0];
  if(file)c.image=await readImage(file);
  save();
  closeModal();
}
function delCard(id){
  const c=cards.find(function(x){return String(x.id)===String(id);});
  if(!c)return;
  if(!confirm("Удалить карту «"+String(c.name||"Моя карта")+"»?\n\nЭто действие нельзя отменить."))return;
  cards=cards.filter(function(c){return String(c.id)!==String(id);});
  save();
  closeModal();
}
function exportData(){
  const blob=new Blob([JSON.stringify({version:1,cards:cards},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="CARD_backup.json";
  a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}
function importData(){const input=document.getElementById("importFile");if(!input){alert("Не найдено поле выбора резервной копии");return;}input.onchange=readImport;input.value="";input.click();}
function readImport(e){
  const f=e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const d=JSON.parse(r.result);
      const list=Array.isArray(d)?d:d.cards;
      if(!Array.isArray(list))throw Error();
      cards=list.filter(function(c){return c&&c.code;}).map(function(c){
        return {id:String(c.id||Date.now()+Math.random()),name:String(c.name||"Моя карта"),code:String(c.code),format:String(c.format||"CODE_128"),image:String(c.image||""),color:String(c.color||colors[0]),cover:String(c.cover||"AUTO"),style:(c.style&&typeof c.style==="object")?c.style:{}};
      });
      save();
      closeModal();
      alert("Карты восстановлены: "+cards.length);
    }catch(x){alert("Не удалось прочитать резервную копию");}
  };
  r.readAsText(f);
  e.target.value="";
}
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js?v=16").catch(function(){});});
}
render();
</script>
